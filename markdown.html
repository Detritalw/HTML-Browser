<!doctype html>
<html lang="zh-CN" data-mode="auto" data-accent="blue"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown 编辑器 - Qwen Browser</title><style>
:root{--bg:#f8fbff;--panel:#fff;--text:#20252b;--muted:#657384;--border:#d8dee7;--accent:#496b86;--soft:#edf4f8;--shadow:0 10px 28px rgba(37,55,75,.08)}html[data-mode=dark]{--bg:#111923;--panel:#1b2530;--text:#e8edf2;--muted:#aeb9c5;--border:#344352;--accent:#8db5d2;--soft:#263b4b;--shadow:0 10px 30px rgba(0,0,0,.25)}html[data-accent=purple]{--accent:#8064a8;--soft:#f0ebf8}html[data-accent=green]{--accent:#397e69;--soft:#e8f4ef}html[data-accent=orange]{--accent:#bd733d;--soft:#fbefe7}html[data-accent=red]{--accent:#ad5962;--soft:#faecee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC",sans-serif}.page{width:min(1200px,100%);margin:auto;padding:28px 20px}.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:22px;font-weight:800}.head h1{margin:0;font-size:22px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}.head button{margin-left:auto}button,textarea{font:inherit}button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent);background:var(--soft)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.status{margin-left:auto;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;color:var(--muted)}textarea{width:100%;min-height:68vh;resize:vertical;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--bg);color:var(--text);font:15px/1.7 ui-monospace,monospace;outline:none}.field textarea:focus{border-color:var(--accent)}.preview{min-height:68vh;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:18px;background:var(--panel);line-height:1.7}.preview h1,.preview h2,.preview h3{line-height:1.25}.preview code{padding:2px 5px;border-radius:5px;background:var(--soft)}.preview pre{overflow:auto;padding:12px;border-radius:9px;background:var(--bg)}.preview blockquote{margin-left:0;padding-left:12px;border-left:3px solid var(--accent);color:var(--muted)}@media(max-width:760px){.page{padding:18px 12px}.grid{grid-template-columns:1fr}.preview{min-height:300px}.head{align-items:flex-start}.head button{margin-left:auto}}
</style></head><body><main class="page"><header class="head"><div class="mark">M↓</div><div><h1>Markdown 编辑器</h1><p>编辑 Markdown 并实时预览</p></div><button id="back">返回浏览器</button></header><section class="card"><div class="toolbar"><button class="primary" id="copy">复制 Markdown</button><button id="download">导出 .md</button><button id="clear">清空</button><span class="status" id="status">实时预览</span></div><div class="grid"><div class="field"><label for="input">Markdown</label><textarea id="input" spellcheck="false" placeholder="# 标题\n\n开始编辑 Markdown..."># Qwen Browser\n\n这是一个 Markdown 编辑器。</textarea></div><div class="field"><label>预览</label><article class="preview" id="preview"></article></div></div></section></main><script>
const $=id=>document.getElementById(id),read=k=>localStorage.getItem(k),applyTheme=()=>{const mode=read('qwen_mode')||'auto';document.documentElement.dataset.mode=mode==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):mode;const color=read('qwen_accent')||'#496b86';document.documentElement.style.setProperty('--custom-accent',color);document.documentElement.dataset.accent='custom'};function back(){if(window.parent!==window&&typeof parent.navigate==='function')parent.navigate('about:blank');else history.back()}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){let s=esc($('input').value);s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');$('preview').innerHTML='<p>'+s+'</p>'}applyTheme();$('back').onclick=back;$('input').oninput=render;$('copy').onclick=()=>navigator.clipboard?.writeText($('input').value).then(()=>$('status').textContent='已复制');$('clear').onclick=()=>{$('input').value='';render()};$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('input').value],{type:'text/markdown'}));a.download='document.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};render();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
</script></body></html>
