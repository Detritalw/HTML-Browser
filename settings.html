<!doctype html>
<html lang="zh-CN" data-mode="auto" data-accent="blue">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>设置 - Qwen Browser</title>
<style>
:root{--bg:#f8fbff;--panel:#fff;--text:#20252b;--muted:#5f6b78;--border:#d8dee7;--accent:#496b86;--accent-soft:#edf4f8;--shadow:0 10px 28px rgba(37,55,75,.06);--dot:#c8dcff}
html[data-mode=dark]{--bg:#111923;--panel:#1b2530;--text:#e8edf2;--muted:#aeb9c5;--border:#344352;--accent:#8db5d2;--accent-soft:#263b4b;--shadow:0 10px 30px rgba(0,0,0,.25);--dot:#2b4056}
html[data-accent=blue]{--accent:#496b86}html[data-accent=purple]{--accent:#8064a8}html[data-accent=green]{--accent:#397e69}html[data-accent=orange]{--accent:#bd733d}html[data-accent=red]{--accent:#ad5962}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:12px 12px;color:var(--text);font-family:"Segoe UI","PingFang SC",sans-serif}.settings-page{width:min(900px,100%);margin:0 auto;padding:32px 20px 48px}.brand-card{background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:18px;padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px}.brand-mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#ed6fa2,#f5ae55);box-shadow:0 7px 16px rgba(237,111,162,.25)}.sf-icon{width:22px;height:22px;object-fit:contain;vertical-align:middle}.brand-mark .sf-icon{width:30px;height:30px;filter:brightness(0) invert(1)}.brand-copy{min-width:0;flex:1}.brand-copy h1{margin:0 0 3px;font-size:20px}.brand-copy p{margin:0;color:var(--muted);font-size:13px}.brand-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.brand-actions button,.back-button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13px}.brand-actions button:hover,.back-button:hover{border-color:var(--accent);background:var(--accent-soft)}.intro{margin:0 0 12px;color:var(--muted);font-size:14px}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.category-card{display:flex;align-items:center;gap:14px;min-height:86px;padding:17px 18px;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit;transition:.2s ease}.category-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 28px rgba(37,55,75,.11)}.category-icon{width:38px;height:38px;display:grid;place-items:center;border:2px solid currentColor;border-radius:12px;color:var(--accent);flex:none}.category-icon .sf-icon{width:22px;height:22px}.category-copy{min-width:0;flex:1}.category-copy strong{display:block;font-size:16px;margin-bottom:5px}.category-copy span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{font-size:25px;color:var(--muted);line-height:1}.detail{display:none}.detail.active{display:block}.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.detail-header h2{margin:0;font-size:20px}.detail-header button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 11px;cursor:pointer}.section{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.section>p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}.grid{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 65%,transparent)}.row:last-child{border-bottom:0}.row label{font-size:14px}.row input[type=text],.row input[type=url],.row input[type=password],.row select{width:min(440px,60%);background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:14px}.row input[type=range]{width:min(440px,60%);accent-color:var(--accent)}.check{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:14px}.check input{accent-color:var(--accent)}.settings-save{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:16px}.settings-save button{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:9px;padding:10px 15px;cursor:pointer;font-size:14px}.hint{color:var(--muted);font-size:12px}.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat-card{padding:12px;border:1px solid var(--border);border-radius:10px;background:color-mix(in srgb,var(--bg) 55%,transparent)}.stat-card strong,.stat-card span{display:block}.stat-card strong{font-size:17px;color:var(--accent);margin-bottom:4px}.stat-card span{font-size:12px;color:var(--muted)}.saved{position:fixed;right:20px;bottom:20px;padding:10px 14px;border-radius:999px;background:var(--accent);color:#fff;opacity:0;transform:translateY(8px);transition:.2s}.saved.show{opacity:1;transform:translateY(0)}@media(max-width:640px){.settings-page{padding:18px 12px 32px}.brand-card{align-items:flex-start;padding:17px}.category-grid{grid-template-columns:1fr}.category-card{min-height:78px}.row{align-items:flex-start;flex-direction:column;gap:8px}.row input[type=text],.row input[type=url],.row input[type=password],.row input[type=range],.row select{width:100%}.settings-save{align-items:stretch;flex-direction:column-reverse}.settings-save button{width:100%}}
</style>
</head>
<body>
<main class="settings-page">
  <section class="brand-card"><div class="brand-mark"><img class="sf-icon" src="https://img.bloret.net/SF/safari" alt=""/></div><div class="brand-copy"><h1>Qwen Browser</h1><p>浏览器设置中心 · 单 HTML 版本</p><div class="brand-actions"><button type="button" id="websiteBtn"><img class="sf-icon" src="https://img.bloret.net/SF/info.circle" alt=""/> 使用说明</button><button type="button" id="backBtn"><img class="sf-icon" src="https://img.bloret.net/SF/arrow.left" alt=""/> 返回浏览器</button></div></div></section>
  <div id="categoryView"><p class="intro">选择一个类别以管理相关设置</p><section class="category-grid">
    <button class="category-card" data-detail="appearance"><span class="category-icon"><img class="sf-icon" src="https://img.bloret.net/SF/paintpalette" alt=""/></span><span class="category-copy"><strong>外观与布局</strong><span>主题、标签页和默认页面</span></span><span class="arrow">›</span></button>
    <button class="category-card" data-detail="wallpaper"><span class="category-icon"><img class="sf-icon" src="https://img.bloret.net/SF/photo" alt=""/></span><span class="category-copy"><strong>壁纸</strong><span>背景图片与显示效果</span></span><span class="arrow">›</span></button>
    <button class="category-card" data-detail="network"><span class="category-icon"><img class="sf-icon" src="https://img.bloret.net/SF/network" alt=""/></span><span class="category-copy"><strong>网络与代理</strong><span>代理地址和访问选项</span></span><span class="arrow">›</span></button>
    <button class="category-card" data-detail="privacy"><span class="category-icon"><img class="sf-icon" src="https://img.bloret.net/SF/lock.shield" alt=""/></span><span class="category-copy"><strong>安全与隐藏</strong><span>隐藏页面和嵌入安全</span></span><span class="arrow">›</span></button>
    <button class="category-card" data-detail="stats"><span class="category-icon"><img class="sf-icon" src="https://img.bloret.net/SF/chart.bar" alt=""/></span><span class="category-copy"><strong>统计信息</strong><span>浏览时间和访问记录概况</span></span><span class="arrow">›</span></button>
    <button class="category-card" data-detail="data"><span class="category-icon"><img class="sf-icon" src="https://img.bloret.net/SF/externaldrive" alt=""/></span><span class="category-copy"><strong>数据管理</strong><span>保存设置与浏览数据</span></span><span class="arrow">›</span></button>
  </section></div>
  <div class="detail" id="appearance"><div class="detail-header"><button type="button" class="back-category"><img class="sf-icon" src="https://img.bloret.net/SF/chevron.left" alt=""/> 分类</button><h2>外观与布局</h2></div><section class="section"><p>调整界面主题和浏览器布局。</p><div class="grid"><div class="row"><label for="mode">深浅色</label><select id="mode"><option value="auto">自动</option><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="row"><label for="accent">主题色</label><select id="accent"><option value="blue">蓝</option><option value="purple">紫</option><option value="green">绿</option><option value="orange">橙</option><option value="red">红</option></select></div><label class="check"><input type="checkbox" id="vertical"/>垂直显示标签页</label><label class="check"><input type="checkbox" id="bookmarkbar"/>显示书签栏</label><div class="row"><label for="defaultTab">默认标签页</label><input id="defaultTab" type="text" placeholder="留空打开空白页"/></div></div></section></div>
  <div class="detail" id="wallpaper"><div class="detail-header"><button type="button" class="back-category"><img class="sf-icon" src="https://img.bloret.net/SF/chevron.left" alt=""/> 分类</button><h2>壁纸</h2></div><section class="section"><p>设置浏览器背景图片。图片只显示在浏览器界面后方，不会影响嵌入网页。</p><div class="grid"><div class="row"><label for="wallpaperUrl">图片链接</label><input id="wallpaperUrl" type="url" placeholder="https://example.com/wallpaper.jpg"/></div><div class="row"><label for="wallpaperMode">显示方式</label><select id="wallpaperMode"><option value="cover">铺满</option><option value="contain">完整显示</option><option value="repeat">平铺</option></select></div><div class="row"><label for="wallpaperOpacity">透明度</label><input id="wallpaperOpacity" type="range" min="0" max="100" step="1"/></div><div class="row"><label for="wallpaperBlur">模糊程度</label><input id="wallpaperBlur" type="range" min="0" max="20" step="1"/></div><label class="check"><input type="checkbox" id="wallpaperEnabled"/>启用壁纸</label></div></section></div>
  <div class="detail" id="network"><div class="detail-header"><button type="button" class="back-category"><img class="sf-icon" src="https://img.bloret.net/SF/chevron.left" alt=""/> 分类</button><h2>网络与代理</h2></div><section class="section"><p>代理地址应包含参数名，或使用 <code>{url}</code> 占位符。</p><div class="grid"><div class="row"><label for="proxy">CORS 代理</label><input id="proxy" type="url" placeholder="https://proxy.example/?url="/></div><div class="row"><label for="proxyKey">代理密码</label><input id="proxyKey" type="password"/></div><label class="check"><input type="checkbox" id="proxyMode"/>开启全局代理模式</label></div></section></div>
  <div class="detail" id="privacy"><div class="detail-header"><button type="button" class="back-category"><img class="sf-icon" src="https://img.bloret.net/SF/chevron.left" alt=""/> 分类</button><h2>安全与隐藏</h2></div><section class="section"><p>控制隐藏页面遮罩和嵌入页面的安全策略。</p><div class="grid"><div class="row"><label for="hideMode">遮罩类型</label><select id="hideMode"><option value="image">图片</option><option value="solid">纯色</option></select></div><div class="row"><label for="hideImage">遮罩图片</label><input id="hideImage" type="url"/></div><label class="check"><input type="checkbox" id="sandbox"/>防跳出模式</label></div></section></div>
  <div class="detail" id="stats"><div class="detail-header"><button type="button" class="back-category"><img class="sf-icon" src="https://img.bloret.net/SF/chevron.left" alt=""/> 分类</button><h2>统计信息</h2></div><section class="section"><p>浏览时间和访问记录概况会保存在当前浏览器中。</p><div class="stats-grid"><div class="stat-card"><strong id="settingsTotalBrowseTime">0秒</strong><span>累计浏览时间</span></div><div class="stat-card"><strong id="settingsTodayBrowseTime">0秒</strong><span>今日浏览时间</span></div><div class="stat-card"><strong id="settingsHistoryCount">0</strong><span>历史记录数</span></div></div></section></div>
  <div class="detail" id="data"><div class="detail-header"><button type="button" class="back-category"><img class="sf-icon" src="https://img.bloret.net/SF/chevron.left" alt=""/> 分类</button><h2>数据管理</h2></div><section class="section"><p>设置修改会自动保存在当前浏览器。手动点击保存可确保全部设置立即写入。</p><div class="settings-save"><span class="hint">本页面使用浏览器本地存储，不上传设置内容。</span><button id="saveSettings" type="button">保存全部设置</button></div></section></div>
</main><div class="saved" id="saved">已保存</div>
<script>
const $=id=>document.getElementById(id),DEFAULT='https://img.bloret.net/img/1788607858835/b9692d328d634464dd5f9e369c9840aa';
function read(k,d=''){return localStorage.getItem(k)??d}const formatDuration=ms=>{const total=Math.max(0,Math.round(ms/1000)),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;return h?`${h}小时${m}分`:m?`${m}分${s}秒`:`${s}秒`};function renderStats(){const stats=(()=>{try{return JSON.parse(read('qwen_browse_stats','{}'))}catch{return {}}})();const day=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});$('settingsTotalBrowseTime').textContent=formatDuration(Number(stats.totalMs)||0);$('settingsTodayBrowseTime').textContent=formatDuration(Number(stats.days?.[day])||0);let history=[];try{history=JSON.parse(read('qwen_history','[]'))}catch{}$('settingsHistoryCount').textContent=String(history.length)}function notifyParent(key,value){try{window.parent.postMessage({type:'qwen-settings-change',key,value},'*')}catch{}try{if(window.parent!==window&&typeof parent.syncSettingsFromStorage==='function')parent.syncSettingsFromStorage(key)}catch{}}function save(k,v){localStorage.setItem(k,v);notifyParent(k,v);showSaved()}
function showSaved(){const el=$('saved');el.classList.add('show');clearTimeout(showSaved.t);showSaved.t=setTimeout(()=>el.classList.remove('show'),1000)}function applyMode(){const v=$('mode').value;document.documentElement.dataset.mode=v==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):v}function sync(){ $('mode').value=read('qwen_mode','auto');$('accent').value=read('qwen_accent','blue');$('vertical').checked=read('qwen_vertical_tabs')==='1';$('bookmarkbar').checked=read('qwen_bookmarkbar_hidden')!=='1';$('defaultTab').value=read('qwen_default_tab');$('proxy').value=read('qwen_cors_proxy');$('proxyKey').value=read('qwen_cors_proxy_key');$('proxyMode').checked=read('qwen_proxy_mode')==='1';$('hideMode').value=read('qwen_hide_mode','image');$('hideImage').value=read('qwen_hide_image',DEFAULT);$('wallpaperUrl').value=read('qwen_wallpaper_url');$('wallpaperMode').value=read('qwen_wallpaper_mode','cover');$('wallpaperOpacity').value=read('qwen_wallpaper_opacity','35');$('wallpaperBlur').value=read('qwen_wallpaper_blur','0');$('wallpaperEnabled').checked=read('qwen_wallpaper_enabled')==='1';$('sandbox').checked=read('qwen_sandbox')==='1';applyMode();document.documentElement.dataset.accent=$('accent').value}
function saveAll(){[['mode','qwen_mode'],['accent','qwen_accent'],['vertical','qwen_vertical_tabs'],['bookmarkbar','qwen_bookmarkbar_hidden'],['defaultTab','qwen_default_tab'],['proxy','qwen_cors_proxy'],['proxyKey','qwen_cors_proxy_key'],['proxyMode','qwen_proxy_mode'],['hideMode','qwen_hide_mode'],['hideImage','qwen_hide_image'],['wallpaperUrl','qwen_wallpaper_url'],['wallpaperMode','qwen_wallpaper_mode'],['wallpaperOpacity','qwen_wallpaper_opacity'],['wallpaperBlur','qwen_wallpaper_blur'],['wallpaperEnabled','qwen_wallpaper_enabled'],['sandbox','qwen_sandbox']].forEach(([id,key])=>{const el=$(id);localStorage.setItem(key,el.type==='checkbox'?(el.checked?'1':'0'):el.value)});notifyParent('qwen_settings');showSaved()}
$('saveSettings').onclick=saveAll;document.querySelector('[data-detail="stats"]').addEventListener('click',()=>setTimeout(renderStats,0));$('backBtn').onclick=()=>{if(window.parent!==window&&typeof parent.navigate==='function')parent.navigate('about:blank');else history.back()};$('websiteBtn').onclick=()=>{if(window.parent!==window&&typeof parent.navigate==='function')parent.navigate('https://www.bing.com/search?q=Qwen+Browser')} ;document.querySelectorAll('.category-card').forEach(card=>card.onclick=()=>{$('categoryView').style.display='none';$(card.dataset.detail).classList.add('active')});document.querySelectorAll('.back-category').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.detail').forEach(d=>d.classList.remove('active'));$('categoryView').style.display='block'});[['mode','qwen_mode',applyMode],['accent','qwen_accent',()=>document.documentElement.dataset.accent=$('accent').value],['vertical','qwen_vertical_tabs'],['bookmarkbar','qwen_bookmarkbar_hidden'],['defaultTab','qwen_default_tab'],['proxy','qwen_cors_proxy'],['proxyKey','qwen_cors_proxy_key'],['proxyMode','qwen_proxy_mode'],['hideMode','qwen_hide_mode'],['hideImage','qwen_hide_image'],['wallpaperUrl','qwen_wallpaper_url'],['wallpaperMode','qwen_wallpaper_mode'],['wallpaperOpacity','qwen_wallpaper_opacity'],['wallpaperBlur','qwen_wallpaper_blur'],['wallpaperEnabled','qwen_wallpaper_enabled'],['sandbox','qwen_sandbox']].forEach(([id,key,fn])=>{$(id).onchange=$(id).oninput=()=>{const el=$(id);save(key,el.type==='checkbox'?(el.checked?'1':'0'):el.value);if(fn)fn()}});sync();renderStats();
</script></body></html>
