<!doctype html>
<html lang="zh-CN" data-mode="auto" data-accent="blue">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>设置 - Qwen Browser</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db;--accent:#3b82f6;--accent-soft:color-mix(in srgb,var(--accent) 15%,transparent);--shadow:0 8px 30px rgba(0,0,0,.12)}
html[data-mode=dark]{--bg:#0b1220;--panel:#111827;--text:#e5e7eb;--muted:#9ca3af;--border:#374151;--shadow:0 8px 30px rgba(0,0,0,.45)}
html[data-accent=purple]{--accent:#8b5cf6}html[data-accent=green]{--accent:#10b981}html[data-accent=orange]{--accent:#f97316}html[data-accent=red]{--accent:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC",sans-serif}.settings-page{width:min(760px,100%);margin:0 auto;padding:24px 18px 40px}.header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.header h1{margin:0;font-size:24px}.header button,.section button,select,input{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:14px}.header button{cursor:pointer}.section{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}.section h2{margin:0 0 5px;font-size:17px}.section>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}.grid{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0}.row label{font-size:14px}.row input[type=text],.row input[type=url],.row input[type=password],.row select{width:min(420px,60%)}.check{display:flex;align-items:center;gap:8px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.settings-save{display:grid;gap:10px;margin-top:18px}.settings-save button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}.saved{position:fixed;right:18px;bottom:18px;padding:10px 14px;border-radius:999px;background:var(--accent);color:#fff;opacity:0;transform:translateY(8px);transition:.2s}.saved.show{opacity:1;transform:translateY(0)}@media(max-width:600px){.settings-page{padding:16px 12px 32px}.row{align-items:flex-start;flex-direction:column;gap:7px}.row input[type=text],.row input[type=url],.row input[type=password],.row select{width:100%}}
</style>
</head>
<body>
<main class="settings-page">
  <header class="header"><button id="backBtn">返回浏览器</button><h1>设置</h1></header>
  <section class="section"><h2>外观与布局</h2><p>调整界面主题和浏览器布局。</p><div class="grid"><div class="row"><label for="mode">深浅色</label><select id="mode"><option value="auto">自动</option><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="row"><label for="accent">主题色</label><select id="accent"><option value="blue">蓝</option><option value="purple">紫</option><option value="green">绿</option><option value="orange">橙</option><option value="red">红</option></select></div><label class="check"><input type="checkbox" id="vertical"/>垂直显示标签页</label><label class="check"><input type="checkbox" id="bookmarkbar"/>显示书签栏</label><div class="row"><label for="defaultTab">默认标签页</label><input id="defaultTab" type="text" placeholder="留空打开空白页"/></div></div></section>
  <section class="section"><h2>网络与代理</h2><p>代理地址应包含参数名，或使用 <code>{url}</code> 占位符。</p><div class="grid"><div class="row"><label for="proxy">CORS 代理</label><input id="proxy" type="url" placeholder="https://proxy.example/?url="/></div><div class="row"><label for="proxyKey">代理密码</label><input id="proxyKey" type="password"/></div><label class="check"><input type="checkbox" id="proxyMode"/>开启全局代理模式</label></div></section>
  <section class="section"><h2>隐藏页面</h2><p>设置 HIDENOW 的遮罩样式。锁定后连续点击三次即可恢复页面。</p><div class="grid"><div class="row"><label for="hideMode">遮罩类型</label><select id="hideMode"><option value="image">图片</option><option value="solid">纯色</option></select></div><div class="row"><label for="hideImage">遮罩图片</label><input id="hideImage" type="url"/></div></div></section>
  <section class="section"><h2>页面安全</h2><p>防跳出模式可能影响登录、弹窗和部分页面功能。</p><label class="check"><input type="checkbox" id="sandbox"/>防跳出模式</label></section>
  <div class="settings-save"><button id="saveSettings">保存全部设置</button><div class="hint">设置修改后会保存在当前浏览器。点击保存按钮可一次性写入全部设置。</div></div>
</main><div class="saved" id="saved">已保存</div>
<script>
const $=id=>document.getElementById(id),DEFAULT='https://img.bloret.net/img/1788607858835/b9692d328d634464dd5f9e369c9840aa';
function read(k,d=''){return localStorage.getItem(k)??d}function notifyParent(key,value){try{window.parent.postMessage({type:'qwen-settings-change',key,value},'*')}catch{}try{if(window.parent!==window&&typeof parent.syncSettingsFromStorage==='function')parent.syncSettingsFromStorage(key)}catch{}}function save(k,v){localStorage.setItem(k,v);notifyParent(k,v);$('saved').classList.add('show');clearTimeout(save.t);save.t=setTimeout(()=>$('saved').classList.remove('show'),900)}
function applyMode(){const v=$('mode').value;document.documentElement.dataset.mode=v==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):v}function sync(){ $('mode').value=read('qwen_mode','auto');$('accent').value=read('qwen_accent','blue');$('vertical').checked=read('qwen_vertical_tabs')==='1';$('bookmarkbar').checked=read('qwen_bookmarkbar_hidden')!=='1';$('defaultTab').value=read('qwen_default_tab');$('proxy').value=read('qwen_cors_proxy');$('proxyKey').value=read('qwen_cors_proxy_key');$('proxyMode').checked=read('qwen_proxy_mode')==='1';$('hideMode').value=read('qwen_hide_mode','image');$('hideImage').value=read('qwen_hide_image',DEFAULT);$('sandbox').checked=read('qwen_sandbox')==='1';applyMode();document.documentElement.dataset.accent=$('accent').value}
function saveAll(){[['mode','qwen_mode'],['accent','qwen_accent'],['vertical','qwen_vertical_tabs'],['bookmarkbar','qwen_bookmarkbar_hidden'],['defaultTab','qwen_default_tab'],['proxy','qwen_cors_proxy'],['proxyKey','qwen_cors_proxy_key'],['proxyMode','qwen_proxy_mode'],['hideMode','qwen_hide_mode'],['hideImage','qwen_hide_image'],['sandbox','qwen_sandbox']].forEach(([id,key])=>{const el=$(id);localStorage.setItem(key,el.type==='checkbox'?(el.checked?'1':'0'):el.value)});notifyParent('qwen_settings');$('saved').classList.add('show');clearTimeout(saveAll.t);saveAll.t=setTimeout(()=>$('saved').classList.remove('show'),1400)}$('saveSettings').onclick=saveAll;$('backBtn').onclick=()=>{if(window.parent!==window&&typeof parent.navigate==='function')parent.navigate('about:blank');else history.back()};[['mode','qwen_mode',applyMode],['accent','qwen_accent',()=>document.documentElement.dataset.accent=$('accent').value],['vertical','qwen_vertical_tabs'],['bookmarkbar','qwen_bookmarkbar_hidden'],['defaultTab','qwen_default_tab'],['proxy','qwen_cors_proxy'],['proxyKey','qwen_cors_proxy_key'],['proxyMode','qwen_proxy_mode'],['hideMode','qwen_hide_mode'],['hideImage','qwen_hide_image'],['sandbox','qwen_sandbox']].forEach(([id,key,fn])=>{$(id).onchange=$(id).oninput=()=>{const el=$(id);save(key,el.type==='checkbox'?(el.checked?'1':'0'):el.value);if(fn)fn()}});sync();
</script></body></html>
