<!doctype html>
<html lang="zh-CN" data-mode="auto">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>络聊 - Qwen Browser</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--panel-2:#f1ece2;--text:#25231f;--muted:#81796d;--border:#d9d0c2;--accent:#b65d3b;--accent-soft:#f4dfd5;--mine:#263b35;--shadow:0 18px 45px rgba(55,39,25,.11)}
html[data-mode=dark]{--bg:#191817;--panel:#24211f;--panel-2:#302b28;--text:#f3eee7;--muted:#b7aa9c;--border:#4a4039;--accent:#e38b68;--accent-soft:#49332b;--mine:#365b4e;--shadow:0 18px 45px rgba(0,0,0,.3)}
*{box-sizing:border-box}body{margin:0;height:100vh;background:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 33%),var(--bg);color:var(--text);font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;overflow:hidden}.app{height:100%;display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1440px;margin:auto;background:color-mix(in srgb,var(--panel) 78%,transparent);box-shadow:var(--shadow)}.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}.brand{padding:22px 20px 16px;border-bottom:1px solid var(--border)}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:800}.brand h1{margin:6px 0 3px;font-size:27px;letter-spacing:-.06em}.brand p{margin:0;color:var(--muted);font-size:12px}.side-toolbar{padding:13px;display:flex;gap:8px;border-bottom:1px solid var(--border)}button,input,textarea{font:inherit;color:var(--text);border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:9px 11px;outline:none}button{cursor:pointer}button:hover{border-color:var(--accent);background:var(--accent-soft)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.side-toolbar input{width:100%;min-width:0}.rooms{flex:1;overflow:auto;padding:10px}.room{display:flex;gap:10px;width:100%;padding:12px;border:1px solid transparent;border-radius:13px;text-align:left;margin-bottom:5px;background:transparent}.room.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}.avatar{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:12px;background:var(--panel-2);color:var(--accent);font-weight:800}.room-main{min-width:0;flex:1}.room-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.room-preview{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.room-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--muted);font-size:10px}.badge{min-width:18px;padding:2px 5px;border-radius:99px;background:var(--accent);color:#fff;text-align:center}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.main{min-width:0;display:flex;flex-direction:column}.chat-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--panel) 90%,transparent)}.chat-head .head-copy{min-width:0;flex:1}.chat-head h2{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.messages{flex:1;overflow:auto;padding:24px clamp(16px,4vw,58px);display:flex;flex-direction:column;gap:13px}.message{display:flex;gap:9px;max-width:min(720px,90%);align-items:flex-end}.message.mine{align-self:flex-end;flex-direction:row-reverse}.message .bubble{padding:10px 13px;border:1px solid var(--border);border-radius:15px 15px 15px 4px;background:var(--panel);line-height:1.55;white-space:pre-wrap;word-break:break-word}.message.mine .bubble{border-color:var(--mine);background:var(--mine);color:#fff;border-radius:15px 15px 4px 15px}.message .meta{font-size:10px;color:var(--muted);white-space:nowrap}.system{align-self:center;color:var(--muted);font-size:12px;margin:12px}.composer{padding:14px 22px;border-top:1px solid var(--border);background:var(--panel)}.composer textarea{display:block;width:100%;min-height:68px;resize:vertical;border-radius:13px}.compose-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;gap:7px}.mobile-only{display:none}.login-note{margin:12px;padding:12px;border:1px dashed var(--border);border-radius:11px;color:var(--muted);font-size:12px;line-height:1.55}.loading{opacity:.65;pointer-events:none}@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:absolute;z-index:4;inset:0 55px 0 0;background:var(--panel);box-shadow:var(--shadow)}.mobile-only{display:inline-flex}.chat-head{padding:14px}.messages{padding:18px 12px}.composer{padding:12px}.message{max-width:96%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="eyebrow">BLÖRET / CHAT</div><h1>络聊</h1><p>轻量、实时的站内消息空间</p></div><div class="side-toolbar"><input id="roomSearch" placeholder="搜索房间" autocomplete="off"/><button id="refreshBtn" title="刷新房间">↻</button></div><div class="rooms" id="rooms"><div class="empty">正在读取房间…</div></div><div class="login-note" id="loginNote">请在浏览器「设置 → 络聊登录」中填写站点地址和 Session Cookie。</div></aside>
<main class="main"><header class="chat-head"><button class="mobile-only" id="menuBtn">☰</button><div class="avatar" id="headAvatar">络</div><div class="head-copy"><h2 id="roomTitle">选择一个房间</h2><p id="roomMeta">先配置登录信息，然后刷新房间列表</p></div><div class="top-actions"><button id="openSettingsBtn">设置</button><button id="logoutBtn">清除登录</button></div></header><section class="messages" id="messages"><div class="system">选择左侧房间开始聊天</div></section><form class="composer" id="composer"><textarea id="messageInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行" disabled></textarea><div class="compose-row"><span class="status" id="status">未连接</span><button class="primary" type="submit" id="sendBtn" disabled>发送</button></div></form></main>
</div>
<script>
const $=id=>document.getElementById(id),KEY={base:'qwen_chat_base_url',cookie:'qwen_chat_session_cookie',csrf:'qwen_chat_csrf_token'};let rooms=[],activeRoom=null,messages=[],eventSource=null;
function read(k,d=''){return localStorage.getItem(k)??d}function baseUrl(){return (read(KEY.base,'https://bbs.bloret.net').trim()||'https://bbs.bloret.net').replace(/\/+$/,'')}function theme(){const mode=read('qwen_mode','auto');document.documentElement.dataset.mode=mode==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):mode}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function headers(){const h={'Accept':'application/json'};const csrf=read(KEY.csrf).trim();if(csrf)h['X-CSRF-Token']=csrf;return h}function applySessionCookie(){const raw=read(KEY.cookie).trim();if(!raw)return;try{const target=new URL(baseUrl());if(target.origin===location.origin){document.cookie=raw.includes('=')?raw:`bbbs_session=${encodeURIComponent(raw)}; path=/; SameSite=Lax`}}catch{}}async function api(path,options={}){applySessionCookie();const r=await fetch(baseUrl()+path,{credentials:'include',...options,headers:{...headers(),...(options.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`请求失败（HTTP ${r.status}）`);return data}function setStatus(t){$('status').textContent=t}function formatTime(v){if(!v)return '';return new Date(Number(v)).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}function initials(room){return (room.title||room.peer_nickname||room.peer_username||'络').slice(0,1)}
function renderRooms(){const box=$('rooms');const q=$('roomSearch').value.trim().toLowerCase();const visible=rooms.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));box.innerHTML=visible.length?visible.map(r=>`<button class="room ${activeRoom?.id===r.id?'active':''}" data-id="${esc(r.id)}"><span class="avatar">${esc(initials(r))}</span><span class="room-main"><span class="room-title">${esc(r.title||r.peer_nickname||r.peer_username||r.id)}</span><span class="room-preview">${esc(r.last_message_preview||r.description||'暂无消息')}</span></span><span class="room-meta"><span>${formatTime(r.last_message_at)}</span>${r.unread_count?`<span class="badge">${r.unread_count}</span>`:''}</span></button>`).join(''):'<div class="empty">没有找到房间</div>';box.querySelectorAll('.room').forEach(b=>b.onclick=()=>openRoom(b.dataset.id))}
function renderMessages(){const box=$('messages');if(!messages.length){box.innerHTML='<div class="system">这个房间还没有消息</div>';return}const username=read('qwen_chat_username');box.innerHTML=messages.map(m=>{const mine=username&&(m.sender===username||m.username===username);return `<article class="message ${mine?'mine':''}"><div class="bubble">${esc(m.content||m.text||'')}</div><span class="meta">${esc(m.sender_nickname||m.sender||m.username||'用户')} · ${formatTime(m.created_at)}</span></article>`}).join('');box.scrollTop=box.scrollHeight}
async function loadRooms(){setStatus('正在连接…');$('rooms').classList.add('loading');try{const data=await api('/api/chat/rooms');rooms=data.rooms||[];$('loginNote').textContent=`已连接 ${read('qwen_chat_username')?`· ${read('qwen_chat_username')}`:''}。房间列表每次打开络聊时刷新。`;setStatus(`${rooms.length} 个房间`);renderRooms()}catch(e){rooms=[];renderRooms();setStatus(e.message);$('loginNote').textContent=`连接失败：${e.message}。请检查设置中的站点地址、Cookie 和 CSRF Token。`}finally{$('rooms').classList.remove('loading')}}
async function openRoom(id){activeRoom=rooms.find(r=>String(r.id)===String(id));if(!activeRoom)return;$('roomTitle').textContent=activeRoom.title||activeRoom.peer_nickname||activeRoom.peer_username||activeRoom.id;$('roomMeta').textContent=activeRoom.description||`${activeRoom.member_count||0} 位成员`;$('headAvatar').textContent=initials(activeRoom);renderRooms();$('messageInput').disabled=false;$('sendBtn').disabled=false;setStatus('读取消息…');try{const data=await api(`/api/chat/rooms/${encodeURIComponent(activeRoom.id)}/messages?limit=60`);messages=data.messages||[];renderMessages();setStatus('已连接');connectEvents()}catch(e){messages=[];renderMessages();setStatus(e.message)}}
function connectEvents(){if(eventSource)eventSource.close();applySessionCookie();const url=baseUrl()+'/api/chat/events';eventSource=new EventSource(url,{withCredentials:true});eventSource.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='message'&&d.message?.room_id===activeRoom?.id){messages.push(d.message);renderMessages()}}catch{}};eventSource.onerror=()=>setStatus('实时连接断开，正在等待重连…')}
async function sendMessage(){const input=$('messageInput'),content=input.value.trim();if(!content||!activeRoom)return;input.value='';$('sendBtn').disabled=true;try{const data=await api(`/api/chat/rooms/${encodeURIComponent(activeRoom.id)}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,msg_type:'text',client_msg_id:`browser-${Date.now()}`})});if(data.message){messages.push(data.message);renderMessages()}setStatus('已发送')}catch(e){input.value=content;setStatus(e.message)}finally{$('sendBtn').disabled=false}}
$('composer').onsubmit=e=>{e.preventDefault();sendMessage()};$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('refreshBtn').onclick=loadRooms;$('roomSearch').oninput=renderRooms;$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('openSettingsBtn').onclick=()=>{if(window.parent!==window&&typeof parent.navigate==='function')parent.navigate('html://settings');else location.href='settings.html'};$('logoutBtn').onclick=()=>{[KEY.cookie,KEY.csrf,KEY.base,'qwen_chat_username'].forEach(k=>localStorage.removeItem(k));if(eventSource)eventSource.close();setStatus('已清除登录信息');loadRooms()};window.addEventListener('storage',e=>{if(Object.values(KEY).includes(e.key))loadRooms()});theme();loadRooms();
</script>
</body>
</html>
