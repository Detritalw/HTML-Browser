<!doctype html>
<html lang="zh-CN" data-mode="auto" data-accent="blue">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON 格式化 - Qwen Browser</title>
<style>
:root{--bg:#f8fbff;--panel:#fff;--text:#20252b;--muted:#657384;--border:#d8dee7;--accent:#496b86;--soft:#edf4f8;--shadow:0 10px 28px rgba(37,55,75,.08)}html[data-mode=dark]{--bg:#111923;--panel:#1b2530;--text:#e8edf2;--muted:#aeb9c5;--border:#344352;--accent:#8db5d2;--soft:#263b4b;--shadow:0 10px 30px rgba(0,0,0,.25)}html[data-accent=purple]{--accent:#8064a8;--soft:#f0ebf8}html[data-accent=green]{--accent:#397e69;--soft:#e8f4ef}html[data-accent=orange]{--accent:#bd733d;--soft:#fbefe7}html[data-accent=red]{--accent:#ad5962;--soft:#faecee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC",sans-serif}.page{width:min(1100px,100%);margin:auto;padding:28px 20px 40px}.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:22px;font-weight:800}.head h1{margin:0;font-size:22px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}button,select,textarea,input{font:inherit}button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent);background:var(--soft)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.status{margin-left:auto;color:var(--muted);font-size:12px}.editor{width:100%;min-height:60vh;resize:vertical;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--bg) 55%,transparent);color:var(--text);padding:14px;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none}.editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.hint{margin:10px 0 0;color:var(--muted);font-size:12px}@media(max-width:640px){.page{padding:18px 12px 28px}.head{align-items:flex-start;flex-wrap:wrap}.actions{width:100%;margin-left:0}.editor{min-height:65vh}}
</style></head><body><main class="page"><header class="head"><div class="mark">{ }</div><div><h1>JSON 格式化</h1><p>校验、格式化和压缩 JSON 数据</p></div><div class="actions"><button id="back">返回浏览器</button></div></header><section class="card"><div class="toolbar"><button class="primary" id="format">格式化</button><button id="minify">压缩</button><button id="copy">复制</button><button id="clear">清空</button><span class="status" id="status">等待输入</span></div><textarea class="editor" id="editor" spellcheck="false" placeholder="粘贴 JSON 数据，例如：{\n  &quot;name&quot;: &quot;Qwen Browser&quot;\n}"></textarea><p class="hint">快捷键：Ctrl / ⌘ + Enter 格式化。所有处理都在当前浏览器完成。</p></section></main><script>
const $=id=>document.getElementById(id),read=k=>localStorage.getItem(k),applyTheme=()=>{const mode=read('qwen_mode')||'auto';document.documentElement.dataset.mode=mode==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):mode;const color=read('qwen_accent')||'#496b86';document.documentElement.style.setProperty('--custom-accent',color);document.documentElement.dataset.accent='custom'};function back(){if(window.parent!==window&&typeof parent.navigate==='function')parent.navigate('about:blank');else history.back()}function parse(){try{return JSON.parse($('editor').value)}catch(e){$('status').textContent='JSON 错误：'+e.message;return null}}function format(){const value=parse();if(value!==null){$('editor').value=JSON.stringify(value,null,2);$('status').textContent='格式化成功'}}function copy(){navigator.clipboard?.writeText($('editor').value).then(()=>$('status').textContent='已复制').catch(()=>{$('editor').select();document.execCommand('copy');$('status').textContent='已复制'})}applyTheme();$('back').onclick=back;$('format').onclick=format;$('minify').onclick=()=>{const value=parse();if(value!==null){$('editor').value=JSON.stringify(value);$('status').textContent='已压缩'}};$('copy').onclick=copy;$('clear').onclick=()=>{$('editor').value='';$('status').textContent='已清空'};$('editor').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();format()}};matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
</script></body></html>
