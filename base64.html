<!doctype html>
<html lang="zh-CN" data-mode="auto" data-accent="blue"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 工具 - Qwen Browser</title><style>
:root{--bg:#f8fbff;--panel:#fff;--text:#20252b;--muted:#657384;--border:#d8dee7;--accent:#496b86;--soft:#edf4f8;--shadow:0 10px 28px rgba(37,55,75,.08)}html[data-mode=dark]{--bg:#111923;--panel:#1b2530;--text:#e8edf2;--muted:#aeb9c5;--border:#344352;--accent:#8db5d2;--soft:#263b4b;--shadow:0 10px 30px rgba(0,0,0,.25)}html[data-accent=purple]{--accent:#8064a8;--soft:#f0ebf8}html[data-accent=green]{--accent:#397e69;--soft:#e8f4ef}html[data-accent=orange]{--accent:#bd733d;--soft:#fbefe7}html[data-accent=red]{--accent:#ad5962;--soft:#faecee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC",sans-serif}.page{width:min(1000px,100%);margin:auto;padding:28px 20px}.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:18px;font-weight:800}.head h1{margin:0;font-size:22px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}.head button{margin-left:auto}button,textarea{font:inherit}button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent);background:var(--soft)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;color:var(--muted)}textarea{width:100%;min-height:330px;resize:vertical;border:1px solid var(--border);border-radius:12px;padding:13px;background:var(--bg);color:var(--text);font:14px/1.6 ui-monospace,monospace;outline:none}.field textarea:focus{border-color:var(--accent)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{margin-top:12px;color:var(--muted);font-size:12px}@media(max-width:640px){.page{padding:18px 12px}.grid{grid-template-columns:1fr}.head{align-items:flex-start}.head button{margin-left:auto}}
</style></head><body><main class="page"><header class="head"><div class="mark">64</div><div><h1>Base64 工具</h1><p>文本 Base64 编码和解码，支持中文</p></div><button id="back">返回浏览器</button></header><section class="card"><div class="grid"><div class="field"><label for="input">输入</label><textarea id="input" placeholder="输入文本或 Base64 字符串"></textarea></div><div class="field"><label for="output">输出</label><textarea id="output" readonly></textarea></div></div><div class="tools"><button class="primary" id="encode">编码</button><button id="decode">解码</button><button id="copy">复制结果</button><button id="swap">交换输入输出</button></div><p class="status" id="status">等待输入</p></section></main><script>
const $=id=>document.getElementById(id),read=k=>localStorage.getItem(k),applyTheme=()=>{const mode=read('qwen_mode')||'auto';document.documentElement.dataset.mode=mode==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):mode;const color=read('qwen_accent')||'#496b86';document.documentElement.style.setProperty('--custom-accent',color);document.documentElement.dataset.accent='custom'};function back(){if(window.parent!==window&&typeof parent.navigate==='function')parent.navigate('about:blank');else history.back()}function encodeText(value){return btoa(unescape(encodeURIComponent(value)))}function decodeText(value){return decodeURIComponent(escape(atob(value.trim())))}function run(fn,label){try{$('output').value=fn($('input').value);$('status').textContent=label}catch(e){$('status').textContent='处理失败：输入格式不正确'}}applyTheme();$('back').onclick=back;$('encode').onclick=()=>run(encodeText,'编码完成');$('decode').onclick=()=>run(decodeText,'解码完成');$('copy').onclick=()=>navigator.clipboard?.writeText($('output').value).then(()=>$('status').textContent='已复制');$('swap').onclick=()=>{const a=$('input').value;$('input').value=$('output').value;$('output').value=a;$('status').textContent='已交换'};matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
</script></body></html>
